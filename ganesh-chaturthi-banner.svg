<!-- main message -->
<g font-family="Arial, Noto Sans Devanagari, sans-serif" text-anchor="middle">
  <text x="980" y="125" font-size="34" font-weight="800" fill="#9a3412" letter-spacing="3">UPSC CSE AUDIO BOOK</text>
  <text x="980" y="175" font-size="19" font-weight="700" fill="#c2410c" letter-spacing="2">STUDY ANYTIME • ANYWHERE • IN HINDI</text>
  <rect x="620" y="225" width="720" height="180" rx="35" fill="#fff" opacity=".82" filter="url(#shadow)"/>
  <text x="980" y="295" font-size="42" font-weight="900" fill="#c2410c">आप सभी को गणेश चतुर्थी की</text>
  <text x="980" y="355" font-size="48" font-weight="900" fill="#ea580c">हार्दिक शुभकामनाएं</text>
  <text x="980" y="450" font-size="22" font-weight="600" fill="#7c2d12">विघ्नहर्ता श्री गणेश जी का आशीर्वाद</text>
  <text x="980" y="485" font-size="22" font-weight="600" fill="#7c2d12">आपके जीवन में सफलता, ज्ञान और खुशियां लेकर आए।</text>
</g>
<!-- study cards -->
<g transform="translate(700 535)" filter="url(#shadow)">
  <rect width="560" height="185" rx="28" fill="#fff" opacity=".94"/>
  <text x="280" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#9a3412">DREAM • LEARN • PREPARE • SUCCEED</text>
  <g font-family="Arial, Noto Sans Devanagari, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="25" y="65" width="105" height="80" rx="14" fill="#fff7ed"/><text x="77" y="95" fill="#c2410c">AUDIO</text><text x="77" y="118" fill="#7c2d12">BOOKS</text>
    <rect x="145" y="65" width="105" height="80" rx="14" fill="#fff7ed"/><text x="197" y="95" fill="#c2410c">UPSC</text><text x="197" y="118" fill="#7c2d12">QUIZ</text>
    <rect x="265" y="65" width="105" height="80" rx="14" fill="#fff7ed"/><text x="317" y="95" fill="#c2410c">NOTES</text><text x="317" y="118" fill="#7c2d12">&amp; PDFs</text>
    <rect x="385" y="65" width="150" height="80" rx="14" fill="#fff7ed"/><text x="460" y="95" fill="#c2410c">CURRENT</text><text x="460" y="118" fill="#7c2d12">AFFAIRS</text>
  </g>
</g>
<g font-family="Arial, sans-serif" text-anchor="middle"><text x="980" y="785" font-size="26" font-weight="900" fill="#9a3412" letter-spacing="2">STUDY HARD  •  STAY POSITIVE  •  KEEP GOING</text><text x="980" y="825" font-size="17" font-weight="700" fill="#c2410c">May Lord Ganesha remove every obstacle from your UPSC journey.</text></g>
