<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UPSC CSE Audio Book</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* === SECURITY CSS: PREVENT TEXT SELECTION & COPYING === */
        body, html {
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none; /* IE 10 and IE 11 */
            user-select: none; /* Standard syntax */
            -webkit-touch-callout: none; /* iOS Safari */
        }
        
        .app-container { height: 100dvh; width: 100%; display: flex; flex-direction: column; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        /* Audio Playing Animation */
        .playing-bars span { animation: bounce 1s infinite; }
        .playing-bars span:nth-child(2) { animation-delay: 0.2s; }
        .playing-bars span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 100% { height: 100%; } 50% { height: 30%; } }

        /* Banner Slider Animations */
        .carousel-slide { transition: transform 0.5s ease-in-out; }
    </style>
    
    <!-- ================= EXTERNAL DATA FILES ================= -->
    <!-- ये फाइलें GitHub पर अलग से सेव होनी चाहिए -->
    <script src="banners.js"></script>
    <script src="current-affairs.js"></script>
    <script src="podcasts.js"></script>
    <script src="quizzes.js"></script>

    <!-- ================= SECURITY JS: PREVENT COPY, CUT, PASTE, RIGHT CLICK ================= -->
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('copy', event => {
            event.preventDefault();
            window.showToast("Security: Copying text is disabled!");
        });
        document.addEventListener('cut', event => event.preventDefault());
        document.addEventListener('paste', event => event.preventDefault());
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-200">

    <!-- AUTHENTICATION SCREEN (Hidden by default in this preview, handled by JS) -->
    <div id="auth-screen" class="fixed inset-0 z-[200] bg-gray-100 dark:bg-gray-900 flex flex-col items-center justify-center p-4 transition-opacity duration-500 overflow-y-auto hidden">
        <div class="w-full max-w-md flex flex-col items-center mb-8">
            <i class="fa-solid fa-headphones text-5xl text-orange-500 mb-3 drop-shadow-lg"></i>
            <h1 class="text-3xl font-extrabold tracking-tight">UPSC <span class="text-orange-500">CSE</span></h1>
            <p class="text-xs font-bold text-orange-500 tracking-widest uppercase mt-1">Audio Book</p>
        </div>
        <div class="bg-white dark:bg-gray-800 w-full max-w-md rounded-3xl shadow-2xl p-6 border border-gray-100 dark:border-gray-700">
            <button onclick="window.loginWithGoogle()" class="w-full bg-gray-50 dark:bg-gray-900 border font-bold py-3.5 rounded-xl hover:bg-gray-100 transition-colors shadow-sm flex items-center justify-center gap-3">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5"> Login with Google
            </button>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="main-app-container" class="app-container relative overflow-hidden flex flex-col hidden">
        <audio id="audio-player"></audio>

        <!-- Toast Message -->
        <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white text-xs md:text-sm px-6 py-3 rounded-full z-[90] shadow-2xl whitespace-nowrap transition-opacity duration-300 opacity-0 pointer-events-none hidden"></div>

        <!-- HEADER -->
        <div class="bg-white dark:bg-gray-800 z-20 shrink-0 shadow-sm w-full" id="header-container">
            <div class="max-w-7xl mx-auto w-full">
                <header class="px-4 py-3 flex items-center justify-between">
                    <i class="fa-solid fa-bars text-xl cursor-pointer hover:text-orange-500" onclick="window.openDrawer()"></i>
                    <div class="flex items-center gap-2 cursor-pointer" onclick="window.changeTab('Home')">
                        <i class="fa-solid fa-headphones text-2xl text-orange-500"></i>
                        <div class="flex flex-col items-start leading-none mt-1">
                            <span class="text-xl font-bold tracking-tight">UPSC <span class="text-orange-500">CSE</span></span>
                            <span class="text-[10px] font-bold text-orange-500 tracking-wider">AUDIO BOOK</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="relative cursor-pointer w-10 h-10 rounded-full flex items-center justify-center hover:bg-gray-100 dark:hover:bg-gray-700" onclick="window.openNotificationsModal()">
                            <i class="fa-regular fa-bell text-xl"></i>
                            <span class="absolute top-1.5 right-2 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white dark:border-gray-800"></span>
                        </div>
                        <div id="header-user-icon" onclick="window.changeTab('Profile')" class="w-9 h-9 rounded-full border flex items-center justify-center cursor-pointer overflow-hidden">
                            <i class="fa-solid fa-user"></i>
                        </div>
                    </div>
                </header>

                <div id="search-container" class="px-4 pb-2 relative">
                    <div class="bg-gray-100 dark:bg-gray-700 rounded-full flex items-center px-4 py-2 border border-transparent focus-within:border-orange-300 focus-within:bg-white">
                        <i class="fa-solid fa-magnifying-glass text-gray-400 mr-3"></i>
                        <input type="text" id="search-input" placeholder="Search for topics, subjects or podcasts..." class="bg-transparent border-none outline-none w-full text-sm h-8" oninput="window.handleSearch(event)" />
                        <button onclick="window.startVoiceSearch()" class="ml-2 w-9 h-9 flex items-center justify-center rounded-full text-gray-500">
                            <i id="mic-icon" class="fa-solid fa-microphone"></i>
                        </button>
                    </div>
                </div>

                <div id="category-container" class="flex overflow-x-auto hide-scrollbar px-4 pt-2 border-b gap-6 max-w-7xl mx-auto"></div>
            </div>
        </div>

        <!-- MAIN CONTENT AREA -->
        <main id="main-content" class="flex-1 overflow-y-auto hide-scrollbar bg-gray-50 dark:bg-gray-900 pb-28 pt-4 w-full relative"></main>

        <!-- MINI PLAYER -->
        <div id="mini-player-wrapper" class="absolute bottom-[65px] left-0 right-0 w-full z-40 hidden px-2 md:px-6 pointer-events-none">
            <div id="mini-player" class="bg-[#F96D15] px-4 py-3 flex-col justify-center shadow-xl rounded-xl animate-slide-up max-w-4xl mx-auto pointer-events-auto flex w-full text-white cursor-pointer" onclick="window.openPlayerModal()"></div>
        </div>

        <!-- BOTTOM NAV -->
        <nav id="bottom-nav" class="shrink-0 h-[65px] bg-white dark:bg-gray-800 border-t w-full z-50 shadow-[0_-5px_20px_-5px_rgba(0,0,0,0.1)]">
            <div class="max-w-md mx-auto w-full h-full flex justify-between items-center px-2" id="nav-items-container"></div>
        </nav>

        <!-- FULL SCREEN PLAYER MODAL -->
        <div id="player-modal" class="fixed inset-0 bg-gray-900/95 z-[100] hidden flex flex-col justify-between p-4 backdrop-blur-md animate-slide-up text-white overflow-y-auto">
            <div class="flex items-center justify-between w-full max-w-2xl mx-auto pt-2">
                <button onclick="window.closePlayerModal()" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center"><i class="fa-solid fa-chevron-down"></i></button>
                <span class="font-bold tracking-wide">Now Playing</span>
                <div class="w-10 h-10"></div>
            </div>
            <div id="player-modal-content" class="flex flex-col items-center justify-center max-w-md mx-auto w-full my-auto py-4"></div>
        </div>

        <!-- SIDEBAR MENU -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-[120] hidden opacity-0 transition-opacity" onclick="window.closeDrawer()"></div>
        <div id="sidebar-menu" class="fixed inset-y-0 left-0 w-72 bg-white dark:bg-gray-800 z-[130] transform -translate-x-full transition-transform flex flex-col shadow-2xl">
            <div class="px-5 py-4 border-b flex items-center justify-between mt-2">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-headphones text-2xl text-orange-500"></i>
                    <span class="text-xl font-bold tracking-tight">UPSC <span class="text-orange-500">CSE</span></span>
                </div>
                <i class="fa-solid fa-xmark text-2xl text-gray-500 cursor-pointer" onclick="window.closeDrawer()"></i>
            </div>
            
            <div class="flex-1 overflow-y-auto py-6 px-4 flex flex-col gap-3">
                <div class="bg-gradient-to-r from-amber-500 to-orange-500 rounded-xl p-4 text-white shadow-lg cursor-pointer transform hover:scale-[1.02]" onclick="window.openUpgradeModal(); window.closeDrawer();">
                    <div class="flex items-center justify-between mb-2">
                        <span class="font-bold text-sm uppercase"><i class="fa-solid fa-crown mr-1"></i> Premium</span>
                        <span class="bg-white/20 px-2 rounded text-[10px] font-bold">₹599/mo</span>
                    </div>
                    <p class="text-xs">Unlock all audiobooks & downloads.</p>
                </div>
                
                <div class="flex items-center justify-between p-3.5 rounded-xl bg-gray-50 dark:bg-gray-700 hover:bg-gray-100 cursor-pointer" onclick="window.changeTab('Quiz'); window.closeDrawer();">
                    <div class="flex items-center gap-3"><i class="fa-solid fa-list-check text-xl w-6 text-orange-500"></i><span class="font-bold text-sm">UPSC Quiz</span></div>
                </div>
                
                <div class="flex items-center justify-between p-3.5 rounded-xl bg-gray-50 dark:bg-gray-700 hover:bg-gray-100 cursor-pointer" onclick="document.getElementById('sidebar-dark-toggle').click()">
                    <div class="flex items-center gap-3"><i class="fa-solid fa-moon text-xl w-6"></i><span class="font-bold text-sm">Dark Mode</span></div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="sidebar-dark-toggle" class="sr-only peer" onchange="window.toggleDarkMode()">
                        <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 peer-checked:bg-orange-500"></div>
                    </label>
                </div>

                <!-- NEW: Contact Us & Privacy Policy (Play Store Protocals) -->
                <a href="mailto:upsccseaudiobook@gmail.com" class="flex items-center gap-3 p-3.5 rounded-xl bg-gray-50 dark:bg-gray-700 hover:bg-gray-100 cursor-pointer">
                    <i class="fa-solid fa-envelope text-blue-500 text-xl w-6 text-center"></i>
                    <span class="font-bold text-sm">Contact Us</span>
                </a>
                
                <div onclick="window.showToast('Privacy Policy: All content is secured and protected.'); window.closeDrawer();" class="flex items-center gap-3 p-3.5 rounded-xl bg-gray-50 dark:bg-gray-700 hover:bg-gray-100 cursor-pointer">
                    <i class="fa-solid fa-shield-halved text-green-500 text-xl w-6 text-center"></i>
                    <span class="font-bold text-sm">Privacy Policy</span>
                </div>
            </div>
        </div>

        <!-- UPGRADE MODAL -->
        <div id="upgrade-modal" class="fixed inset-0 bg-black/80 z-[150] hidden flex justify-center items-center p-4">
            <div class="bg-white dark:bg-gray-800 w-full max-w-md rounded-3xl p-6 relative">
                <i class="fa-solid fa-xmark absolute top-4 right-4 text-xl cursor-pointer" onclick="window.closeUpgradeModal()"></i>
                <h3 class="text-xl font-extrabold mb-4"><i class="fa-solid fa-crown text-amber-500"></i> Go Premium</h3>
                <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-6 flex justify-between items-center text-gray-900">
                    <div><span class="block text-xs font-bold text-amber-600 uppercase">Monthly</span><span class="text-2xl font-extrabold">₹599</span></div>
                </div>
                <button onclick="window.processPayment()" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 text-white font-bold py-3.5 rounded-xl">Pay with Razorpay</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const FALLBACK_IMG = "https://placehold.co/800x450/f3f4f6/9ca3af?text=UPSC+Audio";
        const CATEGORIES = ["All", "History", "Polity", "Geography", "Economy", "Environment", "Science", "Current Affairs", "Ethics"];
        
        window.state = {
            activeTab: 'Home', activeCategory: 'All', searchQuery: '',
            bookmarks: new Set(), downloads: new Set(), currentTrackId: null,
            isPlaying: false, playbackSpeed: 1.0, darkMode: false,
            isPremiumUser: false, isLoggedIn: false, userName: 'Guest', userEmail: ''
        };

        const audioElement = document.getElementById('audio-player');

        function init() {
            renderHeaderExtras(); renderMainContent(); renderBottomNav();
            audioElement.addEventListener('ended', window.handleNextTrack);
            audioElement.addEventListener('timeupdate', updateProgress);
        }

        function updateProgress() {
            const seekBar = document.getElementById('seek-bar');
            const modalSeekBar = document.getElementById('modal-seek-bar');
            const curT = document.getElementById('current-time-disp');
            const modCurT = document.getElementById('modal-current-time');
            if (!isNaN(audioElement.duration)) {
                const formatTime = (sec) => { let m = Math.floor(sec/60); let s = Math.floor(sec%60); return `${m}:${s<10?'0':''}${s}`; };
                if(seekBar) { seekBar.max = audioElement.duration; seekBar.value = audioElement.currentTime; }
                if(modalSeekBar) { modalSeekBar.max = audioElement.duration; modalSeekBar.value = audioElement.currentTime; }
                if(curT) curT.textContent = formatTime(audioElement.currentTime);
                if(modCurT) modCurT.textContent = formatTime(audioElement.currentTime);
            }
        }

        window.processPayment = function() {
            if (!window.state.isLoggedIn) { window.showToast("पहले लॉगिन करें!"); window.closeUpgradeModal(); window.changeTab('Profile'); return; }
            window.open("https://rzp.io/rzp/mQmuz9Lp", "_blank");
            window.showToast("Payment processing...");
            setTimeout(() => { window.state.isPremiumUser = true; window.showToast("Premium Activated!"); window.closeUpgradeModal(); renderMainContent(); }, 2000);
        };

        window.togglePlay = function(id) {
            const track = typeof PODCAST_LIST !== 'undefined' ? PODCAST_LIST.find(p => p.id === id) : null;
            if (!track) return;
            if (track.isPremium && !window.state.isPremiumUser) return window.openUpgradeModal();
            
            if (window.state.currentTrackId === id) {
                window.state.isPlaying = !window.state.isPlaying;
                window.state.isPlaying ? audioElement.play() : audioElement.pause();
            } else {
                window.state.currentTrackId = id; window.state.isPlaying = true;
                audioElement.src = track.audioUrl; audioElement.play();
            }
            renderMainContent(); renderMiniPlayer();
            if(!document.getElementById('player-modal').classList.contains('hidden')) renderPlayerModalContent();
        };

        window.seekAudio = function(val) { audioElement.currentTime = value; };
        window.skipTime = function(sec) { audioElement.currentTime = Math.max(0, Math.min(audioElement.duration || 0, audioElement.currentTime + sec)); };
        
        window.toggleBookmark = function(id) { window.state.bookmarks.has(id) ? window.state.bookmarks.delete(id) : window.state.bookmarks.add(id); window.showToast("Bookmark updated!"); renderMainContent(); renderBottomNav(); };
        window.toggleDownload = function(id) { 
            const track = PODCAST_LIST.find(p=>p.id===id); 
            if(track.isPremium && !window.state.isPremiumUser) return window.openUpgradeModal();
            window.state.downloads.has(id) ? window.state.downloads.delete(id) : window.state.downloads.add(id); 
            window.showToast("Download status updated!"); renderMainContent(); renderBottomNav(); 
        };

        window.changeTab = function(tab) { window.state.activeTab = tab; renderHeaderExtras(); renderMainContent(); renderBottomNav(); window.scrollTo(0,0); };
        window.changeCategory = function(cat) { window.state.activeCategory = cat; renderHeaderExtras(); renderMainContent(); };
        window.handleSearch = function(e) { window.state.searchQuery = e.target.value; renderMainContent(); };
        
        window.openDrawer = () => { document.getElementById('sidebar-overlay').classList.remove('hidden', 'opacity-0'); document.getElementById('sidebar-menu').classList.remove('-translate-x-full'); };
        window.closeDrawer = () => { document.getElementById('sidebar-overlay').classList.add('opacity-0'); document.getElementById('sidebar-menu').classList.add('-translate-x-full'); setTimeout(()=>document.getElementById('sidebar-overlay').classList.add('hidden'), 300); };
        window.openUpgradeModal = () => document.getElementById('upgrade-modal').classList.remove('hidden');
        window.closeUpgradeModal = () => document.getElementById('upgrade-modal').classList.add('hidden');
        window.openPlayerModal = () => { renderPlayerModalContent(); document.getElementById('player-modal').classList.remove('hidden'); };
        window.closePlayerModal = () => document.getElementById('player-modal').classList.add('hidden');
        
        window.showToast = function(msg) {
            const t = document.getElementById('toast'); t.textContent = msg; t.classList.remove('hidden', 'opacity-0'); t.classList.add('opacity-100');
            setTimeout(() => { t.classList.add('opacity-0'); setTimeout(()=>t.classList.add('hidden'), 300); }, 2500);
        };

        function renderHeaderExtras() {
            const sBox = document.getElementById('search-container'), cBox = document.getElementById('category-container');
            if(window.state.activeTab === 'Home') {
                sBox.style.display = 'block'; cBox.style.display = 'flex';
                cBox.innerHTML = CATEGORIES.map(c => `<button onclick="window.changeCategory('${c}')" class="pb-3 text-sm font-semibold border-b-2 ${window.state.activeCategory===c ? 'border-orange-500 text-orange-500':'border-transparent text-gray-500'}">${c}</button>`).join('');
            } else { sBox.style.display = 'none'; cBox.style.display = 'none'; }
        }

        // ================= NEW UI RENDER ENGINE =================
        function renderMainContent() {
            const mainEl = document.getElementById('main-content');
            if (window.state.activeTab === 'Home') {
                let html = '';
                
                // 1. BANNER SLIDER (From banners.js)
                if(!window.state.searchQuery && typeof BANNERS_DATA !== 'undefined' && window.state.activeCategory === 'All') {
                    const activeBanners = BANNERS_DATA.filter(b=>b.isActive);
                    if(activeBanners.length > 0) {
                        html += `<div class="max-w-7xl mx-auto px-4 w-full mb-6 relative rounded-2xl overflow-hidden shadow-lg">
                            <img src="${activeBanners[0].imageUrl}" class="w-full object-cover" onerror="this.src='https://placehold.co/800x350/ffedd5/f97316?text=UPSC+Audio+Book'" />
                        </div>`;
                    }
                }

                // 2. PODCAST LIST (NEW LANDSCAPE DESIGN from podcasts.js)
                html += `<div class="max-w-7xl mx-auto px-4 w-full"><div class="py-2 mb-2 flex justify-between items-end"><h2 class="text-xl font-bold">Latest Podcasts</h2><span class="text-sm font-semibold text-orange-500 cursor-pointer">View All</span></div>`;
                
                let filtered = typeof PODCAST_LIST !== 'undefined' ? PODCAST_LIST.filter(p => (window.state.activeCategory === 'All' || p.category === window.state.activeCategory) && p.title.toLowerCase().includes(window.state.searchQuery.toLowerCase())) : [];
                
                if(filtered.length===0) html += `<div class="text-center p-10 text-gray-500">No content found.</div>`;
                else {
                    html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-4 pb-6 w-full">`;
                    filtered.forEach(p => {
                        const isPlay = window.state.currentTrackId === p.id && window.state.isPlaying;
                        const isLocked = p.isPremium && !window.state.isPremiumUser;
                        const isB = window.state.bookmarks.has(p.id);
                        const isD = window.state.downloads.has(p.id);
                        
                        html += `
                        <div class="bg-white dark:bg-gray-800 rounded-2xl overflow-hidden shadow-sm border border-gray-200 dark:border-gray-700 flex flex-col relative group">
                            <!-- Image 16:9 -->
                            <div class="relative w-full aspect-video bg-gray-200 cursor-pointer overflow-hidden" onclick="window.togglePlay(${p.id})">
                                <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.src='${FALLBACK_IMG}'" />
                                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
                                
                                <span class="absolute top-3 right-3 bg-black/70 text-white text-xs font-semibold px-2 py-1 rounded-md backdrop-blur-sm flex items-center gap-1"><i class="fa-regular fa-clock"></i> ${p.duration}</span>
                                <span class="absolute bottom-3 left-3 bg-orange-600 text-white text-xs font-bold px-3 py-1 rounded-md">${p.episode}</span>
                                
                                ${isLocked ? `<div class="absolute inset-0 bg-black/50 flex flex-col items-center justify-center"><i class="fa-solid fa-lock text-3xl text-amber-400 mb-2"></i><span class="text-white text-xs font-bold uppercase tracking-widest bg-amber-500/80 px-2 py-1 rounded">Premium</span></div>` : 
                                (isPlay ? `<div class="absolute inset-0 bg-black/40 flex items-center justify-center"><div class="flex gap-1 items-end h-8 playing-bars"><span class="w-2 h-full bg-orange-500"></span><span class="w-2 h-2/3 bg-orange-500"></span><span class="w-2 h-full bg-orange-500"></span></div></div>` : 
                                `<div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"><i class="fa-solid fa-circle-play text-white/80 text-6xl"></i></div>`)}
                            </div>
                            
                            <!-- Content -->
                            <div class="p-4 flex flex-col justify-between flex-1">
                                <div>
                                    <div class="flex justify-between items-start mb-1">
                                        <span class="text-xs font-bold text-orange-500">${p.category}</span>
                                        <i class="fa-solid fa-ellipsis-vertical text-gray-400"></i>
                                    </div>
                                    <h3 class="font-bold text-lg text-gray-900 dark:text-white leading-tight mb-2 line-clamp-2">${p.title}</h3>
                                    <div class="flex items-center gap-4 text-xs font-medium text-gray-500 mb-4">
                                        <span><i class="fa-solid fa-headphones mr-1"></i>${p.plays}</span>
                                        <span><i class="fa-regular fa-calendar mr-1"></i>${p.date}</span>
                                    </div>
                                </div>
                                <div class="flex items-center justify-between pt-3 border-t border-gray-100 dark:border-gray-700">
                                    <button onclick="window.togglePlay(${p.id})" class="flex items-center gap-2 font-bold text-sm ${isLocked?'text-amber-500':(isPlay?'text-orange-500':'text-gray-800 dark:text-gray-200 hover:text-orange-500')}">
                                        <i class="fa-solid ${isLocked?'fa-crown':(isPlay?'fa-circle-pause':'fa-circle-play')} text-2xl"></i> ${isLocked?'Unlock Premium':(isPlay?'Pause':'Play Now')}
                                    </button>
                                    <div class="flex gap-4">
                                        <i class="fa-solid fa-circle-check text-xl cursor-pointer ${isD?'text-green-500':'text-gray-300 dark:text-gray-600 hover:text-green-400'}" onclick="window.toggleDownload(${p.id})"></i>
                                        <i class="fa-solid fa-bookmark text-xl cursor-pointer ${isB?'text-orange-500':'text-gray-300 dark:text-gray-600 hover:text-orange-400'}" onclick="window.toggleBookmark(${p.id})"></i>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                    });
                    html += `</div></div>`;
                }
                mainEl.innerHTML = html;
            } else if (window.state.activeTab === 'Profile') {
                mainEl.innerHTML = `<div class="max-w-3xl mx-auto px-4 flex flex-col items-center justify-center mt-10"><div class="w-32 h-32 bg-orange-100 rounded-full flex items-center justify-center text-5xl text-orange-500 mb-4 shadow"><i class="fa-solid fa-user"></i></div><h2 class="text-2xl font-bold">${window.state.userName}</h2><p class="text-gray-500">${window.state.isPremiumUser?'Premium Member':'Free Account'}</p><button onclick="window.openUpgradeModal()" class="mt-8 bg-gradient-to-r from-amber-500 to-orange-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg flex items-center gap-2"><i class="fa-solid fa-crown"></i> Get Premium</button></div>`;
            } else {
                mainEl.innerHTML = `<div class="text-center p-10 mt-10 text-gray-500"><i class="fa-solid fa-tools text-4xl mb-3"></i><br>Feature coming soon</div>`;
            }
        }

        function renderMiniPlayer() {
            const pw = document.getElementById('mini-player-wrapper'), pel = document.getElementById('mini-player');
            if(!window.state.currentTrackId) return pw.classList.add('hidden');
            const track = PODCAST_LIST.find(p=>p.id===window.state.currentTrackId);
            pw.classList.remove('hidden');
            pel.innerHTML = `
                <div class="flex items-center justify-between w-full">
                    <div class="flex items-center gap-3 w-[75%] overflow-hidden">
                        <div class="w-12 h-12 rounded-lg bg-white/20 shrink-0 flex items-center justify-center relative overflow-hidden">
                            ${window.state.isPlaying ? `<div class="absolute inset-0 bg-black/20 z-10"></div><div class="flex gap-1 items-end h-4 z-20 playing-bars"><span class="w-1 bg-white"></span><span class="w-1 bg-white"></span><span class="w-1 bg-white"></span></div>` : `<i class="fa-solid fa-music text-white/50"></i>`}
                        </div>
                        <div class="flex flex-col truncate"><span class="text-sm font-bold truncate">${track.title}</span><span class="text-[10px] text-white/80">${track.category}</span></div>
                    </div>
                    <div class="flex gap-4"><button onclick="event.stopPropagation(); window.togglePlay(${track.id})" class="w-10 h-10 bg-white rounded-full text-orange-500 flex items-center justify-center shadow"><i class="fa-solid ${window.state.isPlaying?'fa-pause':'fa-play pl-0.5'}"></i></button><button onclick="event.stopPropagation(); window.closeMiniPlayer()" class="text-white/70 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button></div>
                </div>
            `;
        }
        window.closeMiniPlayer = () => { window.state.isPlaying=false; audioElement.pause(); document.getElementById('mini-player-wrapper').classList.add('hidden'); renderMainContent(); };

        function renderPlayerModalContent() {
            const container = document.getElementById('player-modal-content');
            const track = PODCAST_LIST.find(p=>p.id===window.state.currentTrackId);
            if(!track) return;
            container.innerHTML = `
                <div class="w-72 aspect-video rounded-2xl overflow-hidden shadow-2xl border border-white/20 relative mb-8">
                    <img src="${track.image}" class="w-full h-full object-cover" onerror="this.src='${FALLBACK_IMG}'" />
                </div>
                <h2 class="text-2xl font-bold text-center px-4 mb-1 line-clamp-2">${track.title}</h2>
                <p class="text-sm text-white/70 mb-8">${track.category}</p>
                <div class="w-full px-4 mb-8 flex items-center gap-3"><span id="modal-current-time" class="text-xs w-10">0:00</span><input type="range" id="modal-seek-bar" class="flex-1 h-1.5 bg-white/30 rounded-lg accent-orange-500" value="0"><span id="modal-total-time" class="text-xs w-10 text-right">0:00</span></div>
                <div class="flex items-center justify-center gap-8 mb-10"><i class="fa-solid fa-backward-step text-3xl text-white/80 cursor-pointer" onclick="window.handlePrevTrack()"></i><button onclick="window.togglePlay(${track.id})" class="w-20 h-20 bg-orange-500 rounded-full flex items-center justify-center shadow-lg"><i class="fa-solid ${window.state.isPlaying?'fa-pause':'fa-play pl-1'} text-3xl"></i></button><i class="fa-solid fa-forward-step text-3xl text-white/80 cursor-pointer" onclick="window.handleNextTrack()"></i></div>
            `;
        }

        function renderBottomNav() {
            const tabs = [{id:'Home', i:'fa-house', l:'Home'},{id:'Library', i:'fa-book-open', l:'Library'},{id:'Downloads', i:'fa-download', l:'Downloads'},{id:'Bookmarks', i:'fa-bookmark', l:'Bookmarks'},{id:'Profile', i:'fa-user', l:'Profile'}];
            document.getElementById('nav-items-container').innerHTML = tabs.map(t=>`<button onclick="window.changeTab('${t.id}')" class="flex flex-col items-center flex-1 gap-1 ${window.state.activeTab===t.id?'text-orange-500':'text-gray-400'}"><i class="fa-solid ${t.i} text-xl"></i><span class="text-[10px] font-bold">${t.l}</span></button>`).join('');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
